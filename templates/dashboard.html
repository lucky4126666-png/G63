<h2>Dashboard</h2>
<textarea id="t" rows="10" cols="50"></textarea><br>
<button onclick="save()">Save</button>

<script>
async function load(){
 let r = await fetch("/admin/get")
 let d = await r.json()
 document.getElementById("t").value = d.text || ""
}

async function save(){
 let t = document.getElementById("t").value
 await fetch("/admin/set",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:t})})
 alert("saved")
}

load()
</script>
